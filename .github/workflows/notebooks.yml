name: Notebooks

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  execute:
    name: Execute Sage notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          activate-environment: posqmf-notebooks
          channels: conda-forge
          channel-priority: strict
          auto-update-conda: false

      - name: Install Sage and Jupyter tools
        run: mamba install -y sage=10.9 nbconvert ipykernel tqdm

      - name: Register Sage Jupyter kernel
        run: |
          python -c "from sage.repl.ipython_kernel.install import SageKernelSpec; SageKernelSpec.update(prefix='$CONDA_PREFIX')"
          jupyter kernelspec list

      - name: Generate Python modules from Sage sources
        run: bash posqmf/preparse.sh

      - name: Execute notebooks
        run: |
          set -euo pipefail
          mkdir -p executed-notebooks
          # The notebooks are independent, so execute them in parallel and show each log afterwards
          notebooks=(notebooks/*.ipynb)
          pids=()
          for notebook in "${notebooks[@]}"; do
            jupyter nbconvert \
              --to notebook \
              --execute "${notebook}" \
              --output-dir executed-notebooks \
              --ExecutePreprocessor.kernel_name=sagemath \
              --ExecutePreprocessor.timeout=-1 \
              > "executed-notebooks/$(basename "${notebook}").log" 2>&1 &
            pids+=($!)
          done
          failed=0
          for i in "${!notebooks[@]}"; do
            if wait "${pids[i]}"; then status=passed; else status=FAILED; failed=1; fi
            echo "::group::${notebooks[i]} (${status})"
            cat "executed-notebooks/$(basename "${notebooks[i]}").log"
            echo "::endgroup::"
          done
          # Only call `exit` on failure: in this login shell it runs ~/.bash_logout, whose failing
          # clear_console turns even `exit 0` into exit code 1 under `set -e`
          if [ "${failed}" -ne 0 ]; then exit 1; fi

      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: executed-notebooks/
          if-no-files-found: ignore
