name: Comparator

# Checks the proofs of the library against the self-contained statements in
# `posqmf/lean/PosqmfChallenge` with leanprover/comparator: same statements and definitions,
# no axioms beyond the permitted ones, and acceptance by the Lean kernel. See
# `posqmf/lean/PosqmfChallenge/README.md`. Comparator sandboxes the builds with landrun, which needs
# Linux (Landlock). Comparator and lean4export are Lake dependencies of the project, so they are
# built with the project's own toolchain, as lean4export has to read the project's `.olean` files.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: posqmf/lean

    steps:
      - uses: actions/checkout@v4

      - name: Check out landrun
        uses: actions/checkout@v4
        with:
          repository: Zouuup/landrun
          ref: v0.1.17
          path: .tools/landrun

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build landrun
        working-directory: .tools/landrun
        run: go build -o landrun cmd/landrun/main.go

      - name: Install elan
        working-directory: .
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build the library, the challenges, Comparator and lean4export
        run: |
          lake exe cache get
          lake build Posqmf PosqmfChallenge
          lake build Comparator/comparator lean4export/lean4export

      - name: Compare every configuration
        env:
          COMPARATOR_LANDRUN: ${{ github.workspace }}/.tools/landrun/landrun
          COMPARATOR_LEAN4EXPORT: ${{ github.workspace }}/posqmf/lean/.lake/packages/lean4export/.lake/build/bin/lean4export
        run: |
          failed=()
          echo '| Configuration | Result |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          for config in comparator/*.json; do
            name="$(basename "$config" .json)"
            echo "::group::$name"
            if lake exe comparator "$config"; then
              echo "| $name | ✅ verified |" >> "$GITHUB_STEP_SUMMARY"
            else
              failed+=("$name")
              echo "| $name | ❌ rejected |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=Comparator::$name did not match its challenge"
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -ne 0 ]; then
            echo "Comparator rejected: ${failed[*]}"
            exit 1
          fi
